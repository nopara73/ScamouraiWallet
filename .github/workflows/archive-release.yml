name: Archive release

on:
  push:
    tags:
      - "post-mortem-v*"

permissions:
  contents: write

concurrency:
  group: archive-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build-release:
    name: Validate, package, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-site.txt

      - name: Install validators and site dependency
        run: |
          python -m pip install --disable-pip-version-check \
            -r tools/requirements-site.txt \
            cffconvert==2.0.0 \
            PyYAML==6.0.2

      - name: Require the expected annotated tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          metadata_version="$(python -c 'import json; print(json.load(open(".zenodo.json", encoding="utf-8"))["version"])')"
          test "$RELEASE_TAG" = "post-mortem-v${metadata_version}"

      - name: Validate citation and deposit metadata
        run: |
          cffconvert --validate
          python -m json.tool .zenodo.json > /dev/null
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path
          import yaml

          cff = yaml.safe_load(Path("CITATION.cff").read_text(encoding="utf-8"))
          zenodo = json.loads(Path(".zenodo.json").read_text(encoding="utf-8"))
          cff_date = cff["date-released"]
          if isinstance(cff_date, datetime.date):
              cff_date = cff_date.isoformat()
          assert str(cff["version"]) == str(zenodo["version"])
          assert cff_date == zenodo["publication_date"]
          assert zenodo["upload_type"] == "publication"
          assert zenodo["publication_type"] == "report"
          assert not cff.get("doi"), "Do not publish a placeholder DOI"
          assert not any(author.get("orcid") for author in cff["authors"]), "Do not publish a placeholder ORCID"
          assert not zenodo.get("doi"), "Do not publish a placeholder DOI"
          PY

      - name: Validate machine-readable indexes
        run: |
          python -m json.tool ENTITY_ALIASES.json > /dev/null
          python -m json.tool EVIDENCE_MANIFEST.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          required = {
              "claim_id",
              "claim",
              "subject",
              "date",
              "primary_source_url",
              "archived_source_path",
              "supporting_excerpt",
              "source_type",
              "confidence",
              "caveat",
              "essay_section",
          }
          seen = set()
          count = 0
          for line_number, line in enumerate(Path("CLAIMS.jsonl").read_text(encoding="utf-8").splitlines(), 1):
              if not line.strip():
                  continue
              record = json.loads(line)
              missing = required - record.keys()
              assert not missing, f"CLAIMS.jsonl:{line_number}: missing {sorted(missing)}"
              claim_id = record["claim_id"]
              assert claim_id not in seen, f"duplicate claim_id: {claim_id}"
              seen.add(claim_id)
              count += 1
          assert count, "CLAIMS.jsonl is empty"
          PY
          python tools/build_evidence_manifest.py --check
          python tools/build_timestamp_manifest.py --check

      - name: Validate the canonical static site
        run: python tools/build_site.py --check

      - name: Build and verify release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/build_release.py --output dist --tag "$RELEASE_TAG"
          git bundle verify dist/upload/ScamouraiWallet-full-history-*.bundle
          cd dist/upload
          sha256sum -c SHA256SUMS

      - name: Retain a workflow copy of the release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-archive
          path: dist/upload/
          if-no-files-found: error
          compression-level: 0

      - name: Create the GitHub Release and upload all archival assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$notes"
          cat >> "$notes" <<'EOF'

          This release freezes the report, evidence indexes, canonical site, source
          snapshot, and full Git history at the exact commit recorded in COMMIT.txt.
          Verify every downloaded asset with SHA256SUMS. A DOI is intentionally absent
          until an archival service has registered one.
          EOF

          mapfile -d '' assets < <(find dist/upload -type f -print0 | sort -z)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft)"
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to replace assets on an already published release" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --draft \
              --title "Post-Mortem archival edition ${RELEASE_TAG#post-mortem-v}" \
              --notes-file "$notes"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
