name: Publish canonical edition

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate Pages artifact
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-site.txt

      - name: Install the pinned renderer
        run: python -m pip install --disable-pip-version-check -r tools/requirements-site.txt

      - name: Verify the committed static edition
        run: python tools/build_site.py --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy canonical edition
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
